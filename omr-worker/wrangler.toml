name = "solfa-omr-worker"
main = "src/worker.js"
compatibility_date = "2026-05-20"
workers_dev = true

[[kv_namespaces]]
binding = "OMR_KV"
id = "48f38e45bca5414d81cc97b940f119ac"

[triggers]
crons = ["0 */6 * * *"]

[vars]
GITHUB_REPOSITORY = "don-jeff122/solfa-player"
GITHUB_WORKFLOW = "omr-conversion.yml"
GITHUB_REF = "main"
ALLOWED_ORIGINS = "https://don-jeff122.github.io,http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:4173,http://localhost:4173"
MAX_PDF_BYTES = "26214400"
MAX_RESULT_BYTES = "67108864"
CHUNK_BYTES = "2097152"
MAX_UPLOADS_PER_HOUR = "4"
MAX_UPLOADS_PER_DAY = "8"
MAX_ACTIVE_JOBS = "2"
JOB_TTL_SECONDS = "7200"
